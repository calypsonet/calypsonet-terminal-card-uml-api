extends: default

page:
  margin: [1.0in, 0.67in, 0.67in, 0.67in]
  numbering:
    start-at: title

font:
  catalog:
    Montserrat: &montserrat
      regular: Montserrat-Regular.ttf
      bold: Montserrat-Bold.ttf
      italic: Montserrat-Italic.ttf
      bold_italic: Montserrat-BoldItalic.ttf
    JetBrains Mono: &jetbrains
      regular: JetBrainsMono-Regular.ttf
      bold: JetBrainsMono-Bold.ttf
      italic: JetBrainsMono-Italic.ttf
      bold_italic: JetBrainsMono-BoldItalic.ttf
    "M+ 1mn": *jetbrains
    fallback: *montserrat

base:
  font-family: Montserrat
  font-size: 9
  font-color: #333333

role:
  color-calypso:
    font-color: #039efd

title_page:
  align: center
  background-image: image:title-page-rules.svg[]
  logo:
    align: center
    image: image:logo-product.svg[pdfwidth=4.0in]
    top: 45%
  title:
    align: center
    font-size: 14
    font-color: #OOO
    text-transform: uppercase
    top: 40%
  subtitle:
    align: center
    font-size: 18
    font-color: #039efd
    margin-top: 70
    font-style: normal
  authors:
    display: none
    align: center
    margin-top: 15
  revision:
    align: center
    margin-top: 15
    font-style: italic
    font-color: #9d9d9d

toc-h2:
  font-color: #000000

toc-h3:
  font-color: #EF8B3A

toc-h4:
  font-color: 9D9D9D
  font-style: italic

toc-h5:
  font-color: #039efd
  font-style: italic

heading:
  font-color: #039efd
  font-style: normal

heading-h2:
  font-color: #000000

heading-h3:
  font-color: #EF8B3A

heading-h4:
  font-color: #9D9D9D
  font-style: italic

heading-h5:
  font-color: #039efd
  font-style: bold_italic

code:
  font-family: JetBrains Mono
  font-size: 8

literal:
  font-family: JetBrains Mono
  font-size: 8
  font-color: #000000

link:
  font-color: #039efd
  text-decoration: underline

table:
  font-size: 8
  head:
    background-color: #039efd
    font-color: #ffffff
    border-bottom-width: 0.5

running-content:
  start-at: title

header:
  height: 0.8in
  border-color: #9d9d9d
  border-width: 0.5
  padding: [16, 0, 4, 0]
  font-family: Montserrat
  font-size: 7
  font-color: #9d9d9d
  recto: &header-content
    left:
      content: image:logo.svg[pdfwidth=1.5in]
      valign: center
    right:
      content: |
        SPECIFICATION +
        Public +
        {spec-name} +
        _{spec-ref}_
      valign: center
  verso: *header-content

footer:
  height: 0.4in
  border-color: #9d9d9d
  border-width: 0.5
  padding: [4, 0, 4, 0]
  font-family: Montserrat
  font-size: 7
  font-color: #9d9d9d
  recto: &footer-content
    left:
      content: |
        Version {nbsp} {revnumber} +
        Date {nbsp}{nbsp}{nbsp}{nbsp}{nbsp}{nbsp} {revdate}
      valign: center
    right:
      content: |
        [.color-calypso]#{page-number} / {page-count}# +
        _© Calypso Networks Association 2026 -- Reproduction is prohibited without prior written agreement_
      valign: center
  verso: *footer-content